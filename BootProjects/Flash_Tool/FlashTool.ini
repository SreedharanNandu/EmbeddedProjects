; =====================================================================================
;  FlashTool.ini  -  settings of the flash sequence, the log and the CAN / UDS timing
; =====================================================================================
;  - The file is read again every time you click Program: no restart is needed.
;    (The [Log] section is read when the tool starts.)
;    The values below are exactly those built-in values, so the tool behaves as before.
;  - true / false / yes / no / on / off / 1 / 0 are all accepted for on-off settings.
;  - Time is in milliseconds.  Numbers: decimal, or hex with a 0x prefix.
;    Settings marked (hex) are hex numbers; the 0x prefix is optional there.
;    Settings marked (bytes) are hex bytes separated by blanks, e.g.  31 01 FF 00
;  - A mistyped setting name is reported in log.txt ("unknown setting ignored").
;  - Comments start with ; or #   (at the start of a line or after a blank).
; =====================================================================================


[Tool]
; ask before Disconnect aborts a running programming
ConfirmAbort = true


[Log]
; log.txt: every line has a date and time. It lists what you clicked, every sequence step,
; every UDS request and response and the CAN / ISO-TP frames, the progress and all errors.
Enabled       = true
File          = log.txt       ; a relative name is placed next to FlashTool.exe
Append        = true          ; false: start a new file at every program start
MaxSizeKB     = 4096          ; a bigger log is kept once as log.old.txt and a new log.txt is started
; what goes into the log
ShowSteps     = true          ; sequence steps and progress
ShowUds       = true          ; UDS requests / responses
ShowFrames    = true          ; ISO-TP frames (long messages as one summary line)
ShowAllFrames = false         ; every consecutive frame of long messages (very big log!)
RawBus        = false       ; every frame the neoVI receives, also from other nodes
DebugOutput   = true          ; the same lines in the Visual Studio Output window


[CAN]
RequestId  = 0x7E0            ; (hex) tester -> ECU
ResponseId = 0x7E8            ; (hex) ECU -> tester


[IsoTp]
Padding       = 0xAA          ; (hex) filler for unused bytes of a frame
BlockSizeRx   = 0             ; flow control we send: 0 = no further flow control
StMinRx       = 0             ; flow control we send: separation time
TimeoutBs     = 1000          ; wait for the ECU's flow control
TimeoutCr     = 1000          ; wait for the next consecutive frame
MaxWaitFrames = 10


[Uds]
P2Ms     = 1000               ; wait for the first answer
P2StarMs = 5000               ; wait after "response pending" (NRC 78)


; -------------------------------------------------------------------------------------
;  Security access (27 01 seed / 27 02 key)
; -------------------------------------------------------------------------------------
[Security]
Enabled = false               ; true: send 27 before the erase (and in the application, before the jump)
Level   = 01                  ; (hex) request-seed sub-function, the key is sent with +1
; how the key is calculated from the seed:
;   None      no function, security access cannot be used
;   Xor       key = seed xor Mask      (Mask is repeated if it is shorter than the seed)
;   Add       key = seed + Mask        (big-endian, as long as the seed)
;   Constant  the key is always Key
;   Dll       seed&key DLL (Vector style GenerateKeyEx), see Dll / Function / Variant below
Method  = None
Mask    =                     ; (bytes) for Xor / Add, e.g.  A5 5A 3C C3
Key     =                     ; (bytes) for Constant
Dll     = SeedKey.dll         ; for Dll: a relative name is looked up next to FlashTool.exe (32-bit DLL needed)
Function = GenerateKeyEx
CallingConvention = Cdecl     ; Cdecl or StdCall
Variant =
DllLevel = 1                  ; level that is given to the DLL


; -------------------------------------------------------------------------------------
;  The sequence
; -------------------------------------------------------------------------------------
[Sequence]
; ---- getting into the boot
UseProgrammingSession  = true   ; false: the ECU is assumed to be in the boot already (no 10 02)
DetectApplication      = true   ; true: read ModeDid first to find out whether the boot or the application runs
ModeDid                = F180   ; (hex) DID that differs between boot and application
ModeBootData           =        ; (bytes) the answer starts with this = boot (empty: not used)
ModeAppData            =        ; (bytes) the answer starts with this = application (empty: not used)
; sent only while the APPLICATION runs, before it jumps to the boot (a refusal is only logged)
AppExtendedSession     = true   ; 10 03 (10 01 if refused)
DisableDtcSetting      = true   ; 85 02
DisableCommunication   = false  ; 28 03 01
JumpResetType          = 03     ; (hex) 11 xx after 10 02 that makes the application jump to the boot
AfterResetDelayMs      = 500
BootWaitMs             = 10000  ; how long to wait for the boot after the jump
BootPollIntervalMs     = 250
TesterPresentIntervalMs = 2000  ; 3E 00 while the bus is idle, 0 = off

; ---- ECU info right after Connect (nothing is changed in the ECU)
; 10 01, 10 03, then 22 ModeDid (boot or application?). In the application the next two DIDs are read
; and shown at the bottom of the window, so you can see which software is in the ECU before you flash.
ReadInfoOnConnect      = true
InfoHwDid              = F191   ; (hex) hardware version
InfoSwDid              = F181   ; (hex) application software version / part number

; ---- reads and writes before the erase
ReadBootInfo           = true   ; boot running: log boot version, serial number, HW, application SW, programmed status
ReadDids               =        ; (hex list) extra 22 reads, e.g.  F190 F18A
ReadDidsMustSucceed    = false
; writes (2E) are listed in an optional [WriteDids] section, see the end of this file

; ---- erase / download / check
EraseTimeoutMs         = 5000   ; wait after each "response pending" of the erase
TransferRetries        = 3      ; a 36 block is sent again this many times if the answer is lost
CheckTimeoutMs         = 5000
ReadAppState           = true   ; read the partition's state DID after the check
DownloadProgressMax    = 95     ; the data transfer fills the bar up to this %, 100 comes at the very end

; ---- optional routine after the last partition (31 <type> <id> <data>)
FinalRoutine           = false
FinalRoutineType       = 01     ; (hex)
FinalRoutineId         = FF02   ; (hex)
FinalRoutineData       =        ; (bytes)

; ---- reset and the check after it
EcuReset               = true   ; 11 xx after the flash
ResetType              = 03     ; (hex)
VerifyAfterReset       = true   ; wait until the ECU answers again
VerifyTimeoutMs        = 5000
ReadPartNumberAfterReset = true ; 10 03 (10 01 if refused), then 22 PartNumberDid
PartNumberDid          = F181   ; (hex)
PartNumberRetries      = 5
PartNumberRetryDelayMs = 500
PartNumberMustSucceed  = false  ; true: the flash counts as failed if the part number cannot be read


; -------------------------------------------------------------------------------------
;  The memory areas that are flashed. Each one has its own section [Partition.<Name>].
; -------------------------------------------------------------------------------------
; Which areas are flashed and in which order. Remove the ; to use it; a name that is not known to
; the program becomes a new area that you define completely in its own [Partition.<Name>] section.
;[Partitions]
;List = Application

[Partition.Application]
StartAddress       = 0x00000000   ; (hex) window of the area: HEX data inside belongs to this area
EndLimit           = 0xFFFFFFFF   ; (hex) first address that is NOT allowed
ImageStart         = FromHex      ; FromHex: the 34 address is the lowest HEX address, PartitionStart: always StartAddress
Alignment          = 4            ; image length is padded to a multiple of this
FillByte           = FF           ; (hex) padding / gap filler
Required           = true         ; the flash fails if the HEX file has no data for this area
DataFormat         = 00           ; (hex) 34 dataFormatIdentifier
AddressBytes       = 4
SizeBytes          = 4
EraseRequest       = 31 01 FF 00  ; (bytes) the complete erase request
EraseWithRange     = false        ; true: address and length of the image are appended to the erase request
CheckRequestPrefix = 31 01 FF 01  ; (bytes) then <length:4> <checksum:2> are appended
StateDid           = F1A0         ; (hex) read after the check, 0 = not read


; -------------------------------------------------------------------------------------
;  Extra requests in the sequence ("add / remove a step without changing the code")
; -------------------------------------------------------------------------------------
; One line per request:   <Place> = <hex bytes> [ | optional ] [ , timeout=<ms> ]
; The lines of one place are sent in the order of this file. A request that is refused ends the
; flash, unless it is marked optional (then it is only logged). Remove the ; to use a line.
;
; Places:   AfterBootEntry   the boot runs, programming session (10 02) is open
;           BeforeErase      after security access and the reads / writes above
;           AfterFlash       all areas are checked, before the ECU reset
;           AfterReset       the ECU answers again and the part number was read
[Steps]
;BeforeErase = 85 02 | optional
;BeforeErase = 31 01 02 03 | timeout=10000
;AfterFlash  = 14 FF FF FF | optional
;AfterReset  = 10 01 | optional


; -------------------------------------------------------------------------------------
;  Data written (2E) after security access, before the erase: one line  <DID (hex)> = <bytes>
;  If this section exists it replaces the built-in list (which is empty).
; -------------------------------------------------------------------------------------
;[WriteDids]
;F15A = 20 26 10 30
